<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
</head>

<body>

    <h2>Student Management System</h2>

    Enter Student Name:
    <input type="text" id="name">
    <br><br>

    Enter Student Roll Number:
    <input type="text" id="roll">
    <br><br>

    Enter Student Branch:
    <input type="text" id="br">
    <br><br>

    Enter Student Year:
    <input type="text" id="yr">
    <br><br>

    Enter Student CGPA:
    <input type="text" id="cg">
    <br><br>

    <input type="button" value="INSERT" id="b1">
    <input type="button" value="DELETE" id="b2">
    <input type="button" value="UPDATE" id="b3">
    <input type="button" value="DISPLAY" id="b4">

    <p id="d"></p>

    <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    remove,
    update,
    get,
    child
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyDLARTkRTPtvz-GdfdHhyJo2GfNk2XVtuw",
    authDomain: "awpexternal-a99ae.firebaseapp.com",
    databaseURL: "https://awpexternal-a99ae-default-rtdb.firebaseio.com",
    projectId: "awpexternal-a99ae",
    storageBucket: "awpexternal-a99ae.firebasestorage.app",
    messagingSenderId: "205658725289",
    appId: "1:205658725289:web:f8f721e369e4fc3c3a82b8",
    measurementId: "G-4MKJ18Y6QW"
  };

  // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const dbref = getDatabase(app);

        document.getElementById("b1").addEventListener("click", insertData);
        document.getElementById("b2").addEventListener("click", deleteData);
        document.getElementById("b3").addEventListener("click", updateData);
        document.getElementById("b4").addEventListener("click", displayData);


        // INSERT DATA
        function insertData() {

            var n = document.getElementById("name").value;
            var r = document.getElementById("roll").value;
            var b = document.getElementById("br").value;
            var y = document.getElementById("yr").value;
            var c = document.getElementById("cg").value;

            if (r === "") {
                alert("Please enter roll number");
                return;
            }

            var ob = {
                name: n,
                branch: b,
                year: y,
                cgpa: c
            };

            set(ref(dbref, "Student/" + r), ob);

            alert("Student Data Inserted Successfully");
        }


        // DELETE DATA
        function deleteData() {

            var r = document.getElementById("roll").value;

            if (r === "") {
                alert("Please enter roll number");
            }
            else {
                remove(ref(dbref, "Student/" + r));

                alert("Student Data Deleted Successfully");
            }
        }


        // UPDATE DATA
        function updateData() {

            var n = document.getElementById("name").value;
            var r = document.getElementById("roll").value;
            var b = document.getElementById("br").value;
            var y = document.getElementById("yr").value;
            var c = document.getElementById("cg").value;

            if (r === "") {
                alert("Please enter roll number");
                return;
            }

            var ob = {
                name: n,
                branch: b,
                year: y,
                cgpa: c
            };

            update(ref(dbref, "Student/" + r), ob);

            alert("Student Data Updated Successfully");
        }


        // DISPLAY DATA
        function displayData() {

            var r = document.getElementById("roll").value;

            if (r === "") {
                alert("Please enter roll number");
            }
            else {

                get(child(ref(dbref), "Student/" + r)).then(
                    function(data) {

                        if (data.exists()) {

                            var ob = data.val();

                            document.getElementById("d").innerHTML =
                                "Roll Number: " + r + "<br>" +
                                "Name: " + ob.name + "<br>" +
                                "Branch: " + ob.branch + "<br>" +
                                "Year: " + ob.year + "<br>" +
                                "CGPA: " + ob.cgpa;

                        }
                        else {
                            alert("NO DATA AVAILABLE");
                        }
                    }
                );
            }
        }

    </script>

</body>
</html>
